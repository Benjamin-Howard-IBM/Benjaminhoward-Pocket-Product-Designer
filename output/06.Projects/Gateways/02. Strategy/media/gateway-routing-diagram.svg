<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13">

  <!-- Background regions -->
  <rect x="10" y="10" width="470" height="310" rx="8" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="24" y="32" font-size="12" fill="#333" font-weight="600">Data Plane Network</text>

  <rect x="510" y="10" width="460" height="310" rx="8" fill="none" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="524" y="32" font-size="12" fill="#333" font-weight="600">Customer Network</text>

  <!-- Vault Node -->
  <rect x="24" y="155" width="110" height="48" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="79" y="175" text-anchor="middle" fill="#333" font-size="12">Vault Node</text>
  <text x="79" y="192" text-anchor="middle" fill="#555" font-size="11">10.0.0.3</text>

  <!-- Step 1 badge -->
  <circle cx="54" cy="230" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="54" y="235" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">1</text>

  <!-- VPC Default Gateway -->
  <rect x="180" y="55" width="145" height="48" rx="4" fill="#f3e8ff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="252" y="75" text-anchor="middle" fill="#5a2d82" font-size="12">VPC Default Gateway</text>
  <text x="252" y="92" text-anchor="middle" fill="#5a2d82" font-size="11">10.0.0.1</text>

  <!-- Step 2 badge -->
  <circle cx="148" cy="70" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="148" y="75" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">2</text>

  <!-- VPC Routing Table -->
  <rect x="370" y="55" width="95" height="48" rx="4" fill="#dce8f8" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="417" y="75" text-anchor="middle" fill="#1a4a80" font-size="12">VPC Routing</text>
  <text x="417" y="92" text-anchor="middle" fill="#1a4a80" font-size="11">Table</text>

  <!-- Step 3 badge -->
  <circle cx="362" cy="46" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="362" y="51" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">3</text>

  <!-- Dataplane Gateway outer box -->
  <rect x="165" y="140" width="220" height="140" rx="6" fill="#fff5e6" stroke="#e8922a" stroke-width="2"/>
  <text x="275" y="162" text-anchor="middle" fill="#a05a00" font-size="12">Dataplane Gateway</text>
  <text x="275" y="178" text-anchor="middle" fill="#a05a00" font-size="11">10.0.0.4</text>

  <!-- wg0 box -->
  <rect x="195" y="190" width="90" height="36" rx="4" fill="#c6e8ff" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="240" y="208" text-anchor="middle" fill="#1a4a80" font-size="12">wg0</text>
  <text x="240" y="222" text-anchor="middle" fill="#1a4a80" font-size="11">100.64.0.1</text>

  <!-- Step 4 badge -->
  <circle cx="248" cy="132" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="248" y="137" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">4</text>

  <!-- Step 5 badge -->
  <circle cx="184" cy="220" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="184" y="225" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">5</text>

  <!-- Customer Gateway outer box -->
  <rect x="530" y="140" width="200" height="140" rx="6" fill="#fff5e6" stroke="#e8922a" stroke-width="2"/>
  <text x="630" y="162" text-anchor="middle" fill="#a05a00" font-size="12">Customer Gateway</text>
  <text x="630" y="178" text-anchor="middle" fill="#a05a00" font-size="11">172.16.0.5</text>

  <!-- wg1 box -->
  <rect x="560" y="190" width="90" height="36" rx="4" fill="#c6e8ff" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="605" y="208" text-anchor="middle" fill="#1a4a80" font-size="12">wg1</text>
  <text x="605" y="222" text-anchor="middle" fill="#1a4a80" font-size="11">100.64.0.2</text>

  <!-- Step 6 badge -->
  <circle cx="452" cy="208" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="452" y="213" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">6</text>

  <!-- Step 7 badge -->
  <circle cx="660" cy="220" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="660" y="225" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">7</text>

  <!-- Postgres -->
  <rect x="778" y="188" width="110" height="48" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="833" y="208" text-anchor="middle" fill="#333" font-size="12">Postgres</text>
  <text x="833" y="225" text-anchor="middle" fill="#555" font-size="11">172.16.0.99</text>

  <!-- Step 8 badge -->
  <circle cx="746" cy="208" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="746" y="213" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">8</text>

  <!-- Step 9 badge -->
  <circle cx="898" cy="175" r="12" fill="none" stroke="#d4458a" stroke-width="1.5"/>
  <text x="898" y="180" text-anchor="middle" fill="#d4458a" font-size="11" font-weight="700">9</text>

  <!-- Arrows -->
  <!-- Vault -> VPC Default GW (step 2: up and right) -->
  <line x1="134" y1="175" x2="180" y2="79" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- VPC Default GW -> VPC Routing Table (step 3: right) -->
  <line x1="325" y1="79" x2="370" y2="79" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- VPC Default GW -> Dataplane GW (step 4: down) -->
  <line x1="252" y1="103" x2="252" y2="140" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- wg0 -> wg1 (step 6: right, Wireguard tunnel) -->
  <line x1="285" y1="208" x2="560" y2="208" stroke="#d4458a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-pink)"/>

  <!-- wg1 -> Postgres (step 8: right) -->
  <line x1="650" y1="208" x2="778" y2="212" stroke="#d4458a" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d4458a"/>
    </marker>
  </defs>

</svg>
